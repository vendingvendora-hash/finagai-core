name: release
# Controlled release (ADR-071): migrations are applied BEFORE compatible code is deployed, so Render never
# builds a commit whose preflight will refuse the schema. Render auto-deploy is OFF; this workflow is the
# only path to production.
#
#   push to main
#     └─ detect: did migrations/*.sql change since the last release?
#          ├─ no  → deploy (Render deploy hook)
#          └─ yes → migrate (environment "production", required reviewer Julian) → deploy
#
# Safety kept: src/ops/preflight.ts still refuses to start against an incompatible schema.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: release-main, cancel-in-progress: false }

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        # Base = the commit BEFORE this push (github.event.before), never the parent of the tip: a push can carry many commits
        # and the last one need not touch migrations/ (release #1, 2026-10-04: the tip parent hid 0022 and skipped migrate).
        # Manual dispatch or an unknown base (new branch / force push) → assume migrations changed (fail safe).
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "no reliable base ($BEFORE) — running migrate (idempotent) to be safe"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- migrations | grep -q '\.sql$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "migrations changed in $BEFORE..$GITHUB_SHA:"; git diff --name-only "$BEFORE" "$GITHUB_SHA" -- migrations
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no migration changes in $BEFORE..$GITHUB_SHA"
          fi

  migrate:
    needs: detect
    if: needs.detect.outputs.migrations_changed == 'true'
    runs-on: ubuntu-latest
    environment: production        # required reviewer: Julian — the ONLY human step, before any deploy
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q postgresql-client >/dev/null
      - run: bash scripts/migrate.sh
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}

  deploy:
    needs: [detect, migrate]
    # Run when migrate succeeded OR was skipped (no migrations); never when migrate failed.
    if: always() && needs.detect.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (deploy hook; secret never echoed)
        run: |
          test -n "${{ secrets.RENDER_DEPLOY_HOOK }}" || { echo "RENDER_DEPLOY_HOOK secret missing"; exit 1; }
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" >/dev/null && echo "deploy triggered for ${GITHUB_SHA::7}"
      - name: Wait for /health to report this commit (max 6 min)
        run: |
          for i in $(seq 1 36); do
            v=$(curl -fsS https://finagai-core.onrender.com/health | sed -n 's/.*"version":"\([0-9a-f]*\)".*/\1/p')
            case "$v" in ${GITHUB_SHA::7}*) echo "live: $v"; exit 0;; esac
            sleep 10
          done
          echo "deploy did not become live in time (last version: $v)"; exit 1
